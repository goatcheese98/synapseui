name: Legacy Playwright diagnostic
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
permissions:
  contents: read
concurrency:
  group: legacy-playwright-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Install dependencies
      run: corepack enable && corepack pnpm install --frozen-lockfile
    - name: Install Playwright Browsers
      run: corepack pnpm exec playwright install --with-deps
    - name: Run unit tests
      run: corepack pnpm run test:unit
    - name: Run bounded legacy diagnostic (failures remain failures)
      run: corepack pnpm run test:e2e
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: |
          playwright-report/
          test-results/
        retention-days: 30